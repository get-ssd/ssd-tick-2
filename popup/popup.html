<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-muted: #666;
    --primary: #c8a96e;
    --success: #4caf77;
    --warning: #e8a020;
    --danger: #e05050;
    --mono: 'SF Mono', 'Fira Code', monospace;
    --radius: 5px;
  }

  body {
    width: 360px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  .brand { font-weight: 600; color: var(--primary); letter-spacing: 0.04em; }
  #key-count { font-size: 11px; color: var(--text-muted); }

  #key-list { padding: 4px 0; min-height: 40px; max-height: 320px; overflow-y: auto; }

  .empty {
    padding: 16px 14px;
    color: var(--text-muted);
    font-size: 12px;
  }

  .key-card {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .key-card:last-child { border-bottom: none; }

  .key-info { flex: 1; min-width: 0; }

  .key-name {
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .key-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .key-meta .fp { font-family: var(--mono); }

  .key-debuff {
    font-size: 11px;
    color: var(--warning);
    margin-top: 2px;
  }

  .delete-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 3px;
    width: 22px;
    height: 22px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:hover { border-color: var(--danger); color: var(--danger); }

  #add-section {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    background: var(--surface);
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    height: 80px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  textarea::placeholder { color: var(--text-muted); }

  #import-btn {
    margin-top: 8px;
    width: 100%;
    padding: 7px;
    background: var(--primary);
    color: #0a0a0a;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }
  #import-btn:hover { opacity: 0.88; }

  #message {
    margin-top: 8px;
    font-size: 12px;
    min-height: 16px;
    padding: 0 2px;
  }
  #message.error { color: var(--danger); }
  #message.success { color: var(--success); }
</style>
</head>
<body>
<div id="header">
  <span class="brand">SSD Tick</span>
  <span id="key-count">0 keys</span>
</div>

<div id="key-list"></div>

<div id="add-section">
  <div class="section-title">Add key</div>
  <textarea id="key-input" placeholder="Paste key card JSON here…"></textarea>
  <button id="import-btn">Import key card</button>
  <div id="message"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
